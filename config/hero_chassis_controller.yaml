hero_chassis_controller:
  type: hero_chassis_controller/HeroChassisController

  joint_names:
    - left_front_wheel_joint
    - right_front_wheel_joint
    - left_back_wheel_joint
    - right_back_wheel_joint

  max_effort: 5.0

  use_world_velocity: false
  world_frame: odom

  odom_frame: odom
  base_frame: base_link

  max_linear_acceleration: 0.0

  pid:
    left_front_wheel_joint:
      p: 8.0
      i: 1.0
      d: 0.1
      i_clamp_max: 3.0
      i_clamp_min: -3.0
    right_front_wheel_joint:
      p: 8.0
      i: 1.0
      d: 0.1
      i_clamp_max: 3.0
      i_clamp_min: -3.0
    left_back_wheel_joint:
      p: 8.0
      i: 1.0
      d: 0.1
      i_clamp_max: 3.0
      i_clamp_min: -3.0
    right_back_wheel_joint:
      p: 8.0
      i: 1.0
      d: 0.1
      i_clamp_max: 3.0
      i_clamp_min: -3.0

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
